name: GD5 Pull Request Checks

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  pr-checks:
    name: Code Quality & Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for Pygame
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check Python Syntax (Compile Check)
        run: |
          # Fails if any Python file has syntax errors
          python -m compileall -q . --exclude '^\./mods/'

      - name: Lint with flake8 (Syntax errors & undefined names)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F821 --show-source --statistics --exclude mods
          # Exit-zero treats all warnings as non-fatal
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude mods

      - name: Verify Headless Pygame Import & Initialization
        env:
          SDL_VIDEODRIVER: "dummy"
          SDL_AUDIODRIVER: "dummy"
        run: |
          python -c "import pygame; pygame.init(); print('Pygame initialized successfully in CI!')"
