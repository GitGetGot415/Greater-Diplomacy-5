name: GD5 Build

# PyInstaller and py2app each only build for the OS they run on (neither
# cross-compiles), so a real Windows build and a real macOS build require
# running compilation_scripts/windows_compilation.py and
# compilation_scripts/macos_compilation.py on their native runners.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Windows compilation script
        run: python compilation_scripts/windows_compilation.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: gd5-windows
          path: dist/*.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app

      - name: Run macOS compilation script
        run: python3 compilation_scripts/macos_compilation.py

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: gd5-macos
          path: dist/*.zip
          if-no-files-found: error
