name: GD5 Build

# PyInstaller and py2app each only build for the OS they run on (neither
# cross-compiles), so a real Windows build and a real macOS build require
# running compilation_scripts/windows_compilation.py and
# compilation_scripts/macos_compilation.py on their native runners.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Windows compilation script
        run: python compilation_scripts/windows_compilation.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: gd5-windows
          path: dist/*.zip
          if-no-files-found: error

  # The browser target, which nothing here built before.
  #
  # It is the one build where a dependency cannot simply be installed: pygbag
  # serves pure-Python wheels and its own prebuilt WASM ones, so the
  # translation layer arrives as a WebAssembly side module fetched beside the
  # game. Building here proves that file is packed into the archive the
  # browser downloads -- a web build that quietly shipped without it would
  # look fine until somebody opened the Translate screen.
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pygbag
        run: |
          python -m pip install --upgrade pip
          pip install pygbag

      # The committed module must be the one requirements.txt asks for.
      #
      # It is checked in rather than fetched, so that `pygbag main.py` on a
      # fresh clone produces a working Translate screen -- but a checked-in
      # binary can go stale in a way a pinned dependency cannot, and Dependabot
      # raises that pin on its own. This is what stops the two drifting apart
      # silently: a bumped pin with an unchanged binary fails here rather than
      # shipping a browser build running a different library from the desktop.
      - name: The committed WebAssembly module matches the pin
        run: |
          set -e
          ver=$(sed -n 's/^open-dragoman==\([0-9.]*\).*/\1/p' requirements.txt)
          if [ -z "$ver" ]; then
            echo "requirements.txt has no exact pin, so there is nothing to match against"
            exit 0
          fi
          curl -sL --fail -o /tmp/pinned.so \
            "https://github.com/Pr1nted/dragoman/releases/download/v$ver/libdragoman.so"
          if ! cmp -s libdragoman.so /tmp/pinned.so; then
            echo "libdragoman.so is not open-dragoman $ver."
            echo "Run: rm libdragoman.so && python map_tools/fetch_dragoman_wasm.py"
            exit 1
          fi
          echo "libdragoman.so matches open-dragoman $ver"

      - name: Build with pygbag
        run: python -m pygbag --build main.py

      - name: The archive carries the translation layer
        run: |
          set -e
          archive=$(ls build/web/*.apk | head -1)
          test -n "$archive" || { echo "pygbag produced no archive"; exit 1; }
          echo "checking $archive"
          # pygbag's .apk is a zip; the side module has to be inside it or the
          # browser has nothing to load and the screen is dead on arrival.
          # -c rather than a heredoc: the body of one inside a YAML block is
          # indented, and Python will not take that.
          python -c "import sys,zipfile; n=zipfile.ZipFile(sys.argv[1]).namelist(); h=[x for x in n if x.endswith('libdragoman.so')]; print('ok, packed as', h[0]) if h else (print('libdragoman.so is not in the web archive:'), print(chr(10).join(sorted(n)[:40])), sys.exit(1))" "$archive"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: gd5-web
          path: build/web
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install py2app

      - name: Generate pygame_icon.icns for py2app
        # py2app's built-in pygame recipe unconditionally bundles
        # freesansbold.ttf and pygame_icon.icns from the installed pygame
        # package. pygame-ce (what requirements.txt pins) ships
        # pygame_icon_mac.bmp but not the .icns upstream pygame has, so the
        # recipe's copy step fails with FileNotFoundError. Build a real
        # .icns from pygame-ce's own bmp so py2app has something valid to
        # bundle instead of erroring out.
        env:
          # pygame prints a "Hello from the pygame community" / version
          # banner to stdout on import. Without suppressing it, that text
          # gets captured by $(...) along with the dirname below, turning
          # PGDIR into a multi-line garbage path that sips silently rejects.
          PYGAME_HIDE_SUPPORT_PROMPT: '1'
        run: |
          PGDIR=$(python3 -c "import pygame, os; print(os.path.dirname(pygame.__file__))")
          ICNS_PATH="$PGDIR/pygame_icon.icns"
          if [ -f "$ICNS_PATH" ]; then
            echo "pygame_icon.icns already present, skipping."
          else
            ICONSET=$(mktemp -d)/pygame_icon.iconset
            mkdir -p "$ICONSET"
            sips -s format png "$PGDIR/pygame_icon_mac.bmp" --out /tmp/pgicon_base.png
            for sz in 16 32 128 256 512; do
              sips -z $sz $sz /tmp/pgicon_base.png --out "$ICONSET/icon_${sz}x${sz}.png"
              dbl=$((sz * 2))
              sips -z $dbl $dbl /tmp/pgicon_base.png --out "$ICONSET/icon_${sz}x${sz}@2x.png"
            done
            iconutil -c icns "$ICONSET" -o "$ICNS_PATH"
            echo "Generated $ICNS_PATH"
          fi

      - name: Run macOS compilation script
        run: python3 compilation_scripts/macos_compilation.py

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: gd5-macos
          path: dist/*.zip
          if-no-files-found: error
