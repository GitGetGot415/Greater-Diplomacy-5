name: GD5 Version Gate

# version.txt is the announcement every running copy of the game reads: the
# game downloads version.txt, compares the contents with its own GAME_VERSION,
# and tells the player an update exists when version.txt is higher. A commit
# that changes version.txt is therefore the moment the release becomes public,
# and it is one line in one file.
#
# This workflow runs on that commit and asks one question: is there a release
# for the version version.txt now names, carrying files a player can download?
#
# The gate runs AFTER the push, because version.txt is edited and pushed by
# hand and no check can run before a push that nothing announced. A failure
# here is a prompt to publish the draft the release workflow prepared, or to
# revert one line, and it arrives in minutes rather than in a bug report from
# a player who followed the notification to an empty releases page.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'version.txt'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  announced-version-has-a-release:
    name: The announced version has a release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: A release exists for the version version.txt announces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          announced=$(tr -d '[:space:]' < version.txt)
          echo "version.txt announces $announced"

          if ! gh release view "$announced" --json isDraft,assets > /tmp/release.json 2>/dev/null; then
            echo "::error title=Announced version has no release::version.txt now says $announced, so every player on an older version is being told an update exists. There is no release named $announced in this repository. Publish the draft the GD5 Release workflow prepared for $announced, or revert the version.txt change until the release is ready."
            exit 1
          fi

          draft=$(python -c "import json; print(json.load(open('/tmp/release.json'))['isDraft'])")
          count=$(python -c "import json; print(len(json.load(open('/tmp/release.json'))['assets']))")

          if [ "$draft" = "True" ]; then
            echo "::error title=Release for the announced version is still a draft::The release $announced exists but is a draft, which nobody outside this repository can download. Players are already being told to update. Publish it."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error title=Release for the announced version is empty::The release $announced is published and carries no files, so there is nothing for a player who follows the notification to download."
            exit 1
          fi
          echo "release $announced is published with $count file(s)"
